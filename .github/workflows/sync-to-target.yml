name: Sync to Target Account

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Push to Target
        env:
          PAT: ${{ secrets.REPO_SYNC_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init /tmp/repo
          cd /tmp/repo
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/Keshab1997/client-flow-crm.git"
          git fetch origin main
          git checkout -b main FETCH_HEAD
          git push --force \
            "https://KeshabStudios:${PAT}@github.com/KeshabStudios/client-flow-crm.git" \
            main
